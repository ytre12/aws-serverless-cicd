name: Deploy Serverless Lambdas

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: eu-west-1

      - name: Deploy createOrder Lambda
        run: |
          cd lambdas/cmtr_v7hgdxhd_lambda_createOrder
          zip -r ../../createOrder.zip .
          cd ../..
          aws lambda update-function-code --function-name cmtr_v7hgdxhd_lambda_createOrder --zip-file fileb://createOrder.zip

      - name: Deploy reserveStock Lambda
        run: |
          cd lambdas/cmtr_v7hgdxhd_lambda_reserveStock
          zip -r ../../reserveStock.zip .
          cd ../..
          aws lambda update-function-code --function-name cmtr_v7hgdxhd_lambda_reserveStock --zip-file fileb://reserveStock.zip

      - name: Deploy sendNotification Lambda
        run: |
          cd lambdas/cmtr_v7hgdxhd_lambda_sendNotification
          zip -r ../../sendNotification.zip .
          cd ../..
          aws lambda update-function-code --function-name cmtr_v7hgdxhd_lambda_sendNotification --zip-file fileb://sendNotification.zip
