name: Deploy Serverless Lambdas

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: eu-west-1

      - name: Deploy createOrder Lambda
        run: |
          cd lambdas
          zip -r ../createOrder.zip cmtr_v7hgdxhd_lambda_createOrder
          cd ..
          aws lambda update-function-code --function-name cmtr_v7hgdxhd_lambda_createOrder --zip-file fileb://createOrder.zip

      - name: Deploy reserveStock Lambda
        run: |
          cd lambdas
          zip -r ../reserveStock.zip cmtr_v7hgdxhd_lambda_reserveStock
          cd ..
          aws lambda update-function-code --function-name cmtr_v7hgdxhd_lambda_reserveStock --zip-file fileb://reserveStock.zip

      - name: Deploy sendNotification Lambda
        run: |
          cd lambdas
          zip -r ../sendNotification.zip cmtr_v7hgdxhd_lambda_sendNotification
          cd ..
          aws lambda update-function-code --function-name cmtr_v7hgdxhd_lambda_sendNotification --zip-file fileb://sendNotification.zip
